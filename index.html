<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB Lights</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
  }

  /* The light layer fills the whole screen */
  #lights {
    position: fixed;
    inset: 0;
    background: #000;
    transition: background 0.1s linear;
  }

  /* Soft glow overlay for depth */
  #lights::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }

  .panel {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    padding: 18px 22px;
    width: min(92vw, 560px);
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
  }

  .status {
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    text-align: center;
    opacity: 0.9;
  }
  .status b { font-weight: 600; }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  button:hover  { background: rgba(255, 255, 255, 0.24); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .speed {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    font-size: 0.85rem;
  }
  .speed input { flex: 1; accent-color: #fff; }

  .swatch {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    vertical-align: -1px;
    margin-right: 4px;
    border: 1px solid rgba(255,255,255,0.6);
  }

  .hint {
    font-size: 0.72rem;
    opacity: 0.6;
    text-align: center;
  }
</style>
</head>
<body>

<div id="lights"></div>

<div class="panel">
  <div class="status">
    Mode: <b id="modeLabel">Rainbow Fade</b>
    &nbsp;•&nbsp;
    Color: <b id="colorLabel"><span class="swatch" id="swatch"></span><span id="colorName">Red</span></b>
  </div>

  <div class="buttons">
    <button id="modeBtn">Switch Mode</button>
    <button id="colorBtn">Switch Color</button>
    <button id="pauseBtn">Pause</button>
  </div>

  <label class="speed">
    Speed
    <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
    <span id="speedVal">1.0×</span>
  </label>

  <div class="hint">Shortcuts: M = mode, C = color, Space = pause. Strobe mode flashes — avoid if sensitive to flashing lights.</div>
</div>

<script>
  // ---------- Config ----------
  const COLORS = [
    { name: "Red",     rgb: [255, 0, 0] },
    { name: "Green",   rgb: [0, 255, 0] },
    { name: "Blue",    rgb: [0, 80, 255] },
    { name: "Cyan",    rgb: [0, 255, 255] },
    { name: "Magenta", rgb: [255, 0, 255] },
    { name: "Yellow",  rgb: [255, 220, 0] },
    { name: "White",   rgb: [255, 255, 255] },
  ];

  const MODES = ["Rainbow Fade", "Breathing", "Strobe", "RGB Wave", "Static"];

  // ---------- State ----------
  let modeIndex = 0;
  let colorIndex = 0;
  let speed = 1;
  let paused = false;
  let t = 0;               // animation time in seconds (scaled by speed)
  let last = performance.now();

  // ---------- Elements ----------
  const lights     = document.getElementById("lights");
  const modeLabel  = document.getElementById("modeLabel");
  const colorName  = document.getElementById("colorName");
  const swatch     = document.getElementById("swatch");
  const speedInput = document.getElementById("speed");
  const speedVal   = document.getElementById("speedVal");
  const pauseBtn   = document.getElementById("pauseBtn");

  const rgb = (c, a = 1) => `rgba(${c[0] * a | 0}, ${c[1] * a | 0}, ${c[2] * a | 0}, 1)`;

  // ---------- UI updates ----------
  function updateLabels() {
    modeLabel.textContent = MODES[modeIndex];
    const c = COLORS[colorIndex];
    colorName.textContent = c.name;
    swatch.style.background = rgb(c.rgb);
  }

  function nextMode()  { modeIndex  = (modeIndex  + 1) % MODES.length;  updateLabels(); }
  function nextColor() { colorIndex = (colorIndex + 1) % COLORS.length; updateLabels(); }
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
  }

  // ---------- Render ----------
  function render() {
    const c = COLORS[colorIndex].rgb;

    switch (MODES[modeIndex]) {
      case "Rainbow Fade": {
        const hue = (t * 60) % 360;                    // 60° per second
        lights.style.background = `hsl(${hue}, 100%, 50%)`;
        break;
      }
      case "Breathing": {
        const a = (Math.sin(t * 2) + 1) / 2;           // 0..1
        const level = 0.08 + a * 0.92;
        lights.style.background = rgb(c, level);
        break;
      }
      case "Strobe": {
        // Capped to a gentle ~3 flashes/sec at max speed
        const on = Math.floor(t * 2) % 2 === 0;
        lights.style.background = on ? rgb(c) : "#000";
        break;
      }
      case "RGB Wave": {
        const shift = (t * 80) % 400;
        lights.style.background =
          `linear-gradient(115deg,
            #ff0000 ${-shift}px,
            #00ff00 ${100 - shift}px,
            #0000ff ${200 - shift}px,
            #ff0000 ${300 - shift}px,
            #00ff00 ${400 - shift}px,
            #0000ff ${500 - shift}px,
            #ff0000 ${600 - shift}px,
            #00ff00 ${700 - shift}px,
            #0000ff ${800 - shift}px)`;
        break;
      }
      case "Static":
      default:
        lights.style.background = rgb(c);
    }
  }

  function loop(now) {
    const dt = (now - last) / 1000;
    last = now;
    if (!paused) t += dt * speed;
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Events ----------
  document.getElementById("modeBtn").addEventListener("click", nextMode);
  document.getElementById("colorBtn").addEventListener("click", nextColor);
  pauseBtn.addEventListener("click", togglePause);

  speedInput.addEventListener("input", () => {
    speed = parseFloat(speedInput.value);
    speedVal.textContent = speed.toFixed(1) + "×";
  });

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "m") nextMode();
    else if (k === "c") nextColor();
    else if (e.code === "Space") { e.preventDefault(); togglePause(); }
  });

  // ---------- Start ----------
  updateLabels();
  requestAnimationFrame(loop);
</script>
</body>
</html>
